<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpoint Kompresör</title>
    <link rel="icon" type="image/png" href="./images/Interpoint Compressor Logo.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Özel CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preload" href="./images/arkaplan.mp4" as="video" type="video/mp4">
    <style>
       /* Video Arka Plan Stili */
       #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1; /* Videoyu diğer içeriklerin arkasına yerleştir */
            
        }

        /* Video Üzerine Eklenen Siyah Katman */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Yarı saydam siyah katman */
            z-index: 0; /* Katmanı videonun üstüne, içeriğin altına yerleştir */
        }

        /* Ana İçerik için Z-index Ayarları */
        .main-content {
            position: relative;
            z-index: 1; /* İçeriği videonun ve katmanın üstüne yerleştir */
        }

        /* Loading Ekranı için Z-index Ayarları */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            z-index: 2; /* Loading ekranını en üste yerleştir */
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body style="background: linear-gradient(135deg, #1a6bbd, #145a8e, #0f4668);">


    <!-- Loading Ekranı -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
    
    </div>
    
     <!-- Navbar -->
     <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand active" href="/index.html">
                <img src="./images/Interpoint Compressor Logo.png" alt="Interpoint Logo" class="navbar-logo">
                <span style="color: white;" class="active">Interpoint Kompresör</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bs-target="#navbarNav" aria-controls="navbarNav" 
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" style="display: flex; flex-direction: row-reverse;">
                    <li class="nav-item" style="margin-left: 4vh;">
                        <a class="nav-link" href="/iletisim.html">İletişim</a>
                    </li>
                    <li class="nav-item" style="margin-left: 4vh;">
                        <a class="nav-link" href="/ürünlerimiz.html">Ürünlerimiz</a>
                    </li>
                    <li class="nav-item" style="margin-left: 4vh;">
                        <a class="nav-link" aria-current="page" href="/hakkimizda.html">Hakkımızda</a>
                    </li>
                    <li class="nav-item" style="margin-left: 4vh;">
                        <button id="lang-toggle" class="btn btn-primary">EN</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Ana İçerik -->
    <div class="container-fluid main-content">
        <div class="row h-100">
            <!-- Sol Taraf -->
            <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center">
                <div class="mb-3" style="display: flex;">
                    <i class="bi bi-shield-check icon-large icon"></i>
                    <div style="display: flex; flex-direction: column; flex-wrap: wrap; align-items: flex-start;">
                        <span class="altBaslik">Güvenilir Hizmet.</span>
                        <span class="altBaslik"><p>Mükemmel Çözümler.</p></span>
                    </div>
                </div>
                <h1 class="sirketAd">INTERPOINT</h1>
                <h1 class="sirketAd">KOMPRESOR</h1>
                <p class="lead altBaslik">Servis & Yedek Parça</p>
            </div>
            <!-- Sağ Taraf -->
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="row" style="display: flex; align-items: center; justify-content: center; height: 100%;">
                    <div class="col-6" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                        <img src="./images/anasayfa1.jpg" style="width: 100%; height: 48%; object-fit: cover;" alt="Resim 1" class="opacity09">
                        <img src="./images/anasayfa4.jpg" style="width: 100%; height: 48%; object-fit: cover;" alt="Resim 2" class="opacity09">
                    </div>
                    <div class="col-6" style="display: flex; align-items: center; justify-content: center; height: 100%;">
                        <img src="./images/anasayfa2.jpg" style="width: 100%; height: 48%; object-fit: cover;" alt="Resim 3" class="opacity09">
                    </div>
                </div>
            </div>
        </div>
    </div>
   
    <!-- Bootstrap 5 JS ve Bağımlılıkları -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loadingScreen = document.getElementById("loading-screen");
        
            // Sayfa ilk açıldığında loading spinner'ı gizle
            setTimeout(() => {
                loadingScreen.classList.remove("show");
            }, 500);
        
            // Tüm linkleri dinle
            document.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", function (event) {
                    const href = this.getAttribute("href");
        
                    // Eğer href değeri boşsa veya sayfa içi bağlantıysa, işlemi durdur
                    if (!href || href.startsWith("#") || href.startsWith("javascript")) return;
        
                    // Telefon ve e-posta bağlantılarında yükleme ekranını tetikleme
                    if (href.startsWith("tel:") || href.startsWith("mailto:")) return;
        
                    // Normal linkler için loading-screen göster ve yönlendir
                    event.preventDefault();
                    loadingScreen.classList.add("show");
        
                    setTimeout(() => {
                        window.location.assign(href);
                    }, 800);
                });
            });
        
            // 🔹 GERİ TUŞU İLE GELİNİRSE LOADING SPINNER'I GİZLE
            window.addEventListener("pageshow", function (event) {
                if (event.persisted) { 
                    loadingScreen.classList.remove("show");
                }
            });
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const video = document.getElementById("video-background");
            video.play(); // Videoyu otomatik başlat
        });
    </script>
   <script>
  document.addEventListener("DOMContentLoaded", function () {
    const langToggle = document.getElementById("lang-toggle");
    const loadingScreen = document.getElementById("loading-screen");
    const navbarCollapse = document.querySelector(".navbar-collapse"); // Navbar menüsünü seç
    
    const elementsToTranslate = {
        "İletişim": "Contact",
        "Ürünlerimiz": "Our Products",
        "Hakkımızda": "About Us",
        "Interpoint Kompresör": "Interpoint Compressor",
        "Güvenilir Hizmet.": "Reliable Service.",
        "Mükemmel Çözümler.": "Perfect Solutions.",
        "Servis & Yedek Parça": "Service & Spare Parts",
        "INTERPOINT": "INTERPOINT",
        "KOMPRESOR": "COMPRESSOR"
    };

    let currentLang = "tr";
    
    langToggle.addEventListener("click", function () {
        loadingScreen.classList.add("show");

        setTimeout(() => {
            currentLang = currentLang === "tr" ? "en" : "tr";
            langToggle.textContent = currentLang === "tr" ? "EN" : "TR";

            document.querySelectorAll(".nav-link, .navbar-brand span, .altBaslik, .sirketAd").forEach(el => {
                if (elementsToTranslate[el.textContent.trim()]) {
                    el.textContent = elementsToTranslate[el.textContent.trim()];
                } else {
                    Object.entries(elementsToTranslate).forEach(([tr, en]) => {
                        if (el.textContent.trim() === en) {
                            el.textContent = tr;
                        }
                    });
                }
            });

            // Navbar'ı kapat
            if (navbarCollapse.classList.contains("show")) {
                navbarCollapse.classList.remove("show"); // Açık ise kapat
            }

            setTimeout(() => {
                loadingScreen.classList.remove("show");
            }, 300);
        }, 300);
    });
});

</script>

</body>
</html>
