       * { margin: 0; padding: 0; box-sizing: border-box; }
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Maksimum genişlik sınırı */
            height: 60vh;
            overflow: hidden;
            border-radius: 10px;
            margin: auto;
            display: flex;
            justify-content: flex-end; /* Resimleri sağ tarafa hizala */
            align-items: center;
        }
        .image-wrapper {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }
        .image-wrapper img {
    width: 100%;
    height: 60vh;
    object-fit: cover;
    display: block;
    opacity: 0;
    position: absolute;
    top: -100%; /* Resimler yukarıda başlıyor */
    left: 0;
    transition: opacity 1s ease-in-out, transform 1s ease-in-out;
}

.image-wrapper img.active {
    opacity: 1;
    transform: translateY(100%);
}

/* İlk resmin görünür olması için başlangıçta ayarlama yap */
.image-wrapper img:first-child {
    opacity: 1;
    top: 0;
    transform: translateY(0);
}

        .dots-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .dot {
            width: 12px;
            height: 12px;
            margin: 5px;
            background-color: gray;
            border-radius: 50%;
            cursor: pointer;
        }
        .dot.active { background-color: black; }



         /* Responsive Tasarım */
         @media (max-width: 1000px) {
            .slider-container {
                width: 90%; /* Küçük ekranlarda genişliği arttır */
                height: 35vh; /* Mobil için boyutu küçült */
            }
            .image-wrapper img {
                height: 40vh;
            }
        }

        @media (max-width: 480px) {
            .slider-container {
                height: 35vh;
            }
            .image-wrapper img {

            }
        }

        /* Ana İçerik için Z-index Ayarları */

            position: relative;

            z-index: 2000; /* Loading ekranını en üste yerleştir */

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loadingScreen = document.getElementById("loading-screen");
        
            // Sayfa ilk açıldığında loading spinner'ı gizle
            setTimeout(() => {
                loadingScreen.classList.remove("show");
            }, 500);
        
            // Tüm linkleri dinle
            document.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", function (event) {
                    const href = this.getAttribute("href");
        
                    // Eğer href değeri boşsa veya sayfa içi bağlantıysa, işlemi durdur
                    if (!href || href.startsWith("#") || href.startsWith("javascript")) return;
        
                    // Telefon ve e-posta bağlantılarında yükleme ekranını tetikleme
                    if (href.startsWith("tel:") || href.startsWith("mailto:")) return;
        
                    // Normal linkler için loading-screen göster ve yönlendir
                    event.preventDefault();
                    loadingScreen.classList.add("show");
        
                    setTimeout(() => {
                        window.location.assign(href);
                    }, 800);
                });
            });
        
            // 🔹 GERİ TUŞU İLE GELİNİRSE LOADING SPINNER'I GİZLE
            window.addEventListener("pageshow", function (event) {
                if (event.persisted) { 
                    loadingScreen.classList.remove("show");
                }
            });
        });
    </script>

 <script>
    document.addEventListener("DOMContentLoaded", function () {
        const langToggle = document.getElementById("lang-toggle");
        const loadingScreen = document.getElementById("loading-screen");
        const navbarCollapse = document.querySelector(".navbar-collapse");
  
        const elementsToTranslate = {
            "İletişim": "Contact",
            "Ürünlerimiz": "Our Products",
            "Hakkımızda": "About Us",
            "Interpoint Kompresör": "Interpoint Compressor",
            "Güvenilir Hizmet.": "Reliable Service.",
            "Mükemmel Çözümler.": "Perfect Solutions.",
            "Servis & Yedek Parça": "Service & Spare Parts",
            "INTERPOINT": "INTERPOINT",
            "KOMPRESOR": "COMPRESSOR"
        };
  
        // Varsayılan dili belirle
        let currentLang = localStorage.getItem("selectedLang") || "tr";
        updateLanguage(currentLang);
  
        langToggle.addEventListener("click", function () {
            loadingScreen.classList.add("show");
  
            setTimeout(() => {
                currentLang = currentLang === "tr" ? "en" : "tr";
                localStorage.setItem("selectedLang", currentLang); // Seçilen dili kaydet
                updateLanguage(currentLang);
  
                // Navbar'ı kapat
                if (navbarCollapse.classList.contains("show")) {
                    navbarCollapse.classList.remove("show");
                }
  
                setTimeout(() => {
                    loadingScreen.classList.remove("show");
                }, 300);
            }, 300);
        });
  
        function updateLanguage(lang) {
            langToggle.textContent = lang === "tr" ? "EN" : "TR";
  
            document.querySelectorAll(".nav-link, .navbar-brand span, .altBaslik, .sirketAd").forEach(el => {
                let text = el.textContent.trim();
                if (lang === "en" && elementsToTranslate[text]) {
                    el.textContent = elementsToTranslate[text];
                } else if (lang === "tr") {
                    let trText = Object.keys(elementsToTranslate).find(key => elementsToTranslate[key] === text);
                    if (trText) el.textContent = trText;
                }
            });
        }
    });
  </script>
  
<script>
    const images = document.querySelectorAll(".image-wrapper img");
    const dotsContainer = document.getElementById("dots");
    let currentIndex = 0;
    let interval;
    
    function createDots() {
        for (let i = 0; i < images.length; i++) {
            const dot = document.createElement("div");
            dot.classList.add("dot");
            dot.dataset.index = i;
            dot.addEventListener("click", function() {
                clearInterval(interval);
                moveToSlide(i);
                autoSlide();
            });
            dotsContainer.appendChild(dot);
        }
        updateDots();
    }
    
    function updateDots() {
        document.querySelectorAll(".dot").forEach(dot => dot.classList.remove("active"));
        dotsContainer.children[currentIndex].classList.add("active");
    }
    
    function moveToSlide(index) {
    images.forEach(img => {
        img.classList.remove("active");
        img.style.transform = "translateY(-100%)"; // Eski resim yukarı kayar
    });

    images[index].classList.add("active");
    images[index].style.top = "0"; // Yeni resmin görünmesi için top sıfırlanır
    images[index].style.transform = "translateY(0)"; // Yeni resim aşağı kayarak gelir
    currentIndex = index;
    updateDots();
}


    function autoSlide() {
        interval = setInterval(() => {
            currentIndex = (currentIndex + 1) % images.length;
            moveToSlide(currentIndex);
        }, 3000);
    }
    
    createDots();
    autoSlide();
</script>
