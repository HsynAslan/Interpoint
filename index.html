    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loadingScreen = document.getElementById("loading-screen");
        
            // Sayfa ilk açıldığında loading spinner'ı gizle
            setTimeout(() => {
                loadingScreen.classList.remove("show");
            }, 500);
        
            // Tüm linkleri dinle
            document.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", function (event) {
                    const href = this.getAttribute("href");
        
                    // Eğer href değeri boşsa veya sayfa içi bağlantıysa, işlemi durdur
                    if (!href || href.startsWith("#") || href.startsWith("javascript")) return;
        
                    // Telefon ve e-posta bağlantılarında yükleme ekranını tetikleme
                    if (href.startsWith("tel:") || href.startsWith("mailto:")) return;
        
                    // Normal linkler için loading-screen göster ve yönlendir
                    event.preventDefault();
                    loadingScreen.classList.add("show");
        
                    setTimeout(() => {
                        window.location.assign(href);
                    }, 800);
                });
            });
        
            // 🔹 GERİ TUŞU İLE GELİNİRSE LOADING SPINNER'I GİZLE
            window.addEventListener("pageshow", function (event) {
                if (event.persisted) { 
                    loadingScreen.classList.remove("show");
                }
            });
        });
    </script>

 <script>
    document.addEventListener("DOMContentLoaded", function () {
    const langToggle = document.getElementById("lang-toggle");
    const loadingScreen = document.getElementById("loading-screen");
    const navbarCollapse = document.querySelector(".navbar-collapse");

    const elementsToTranslate = {
        "İletişim": "Contact",
        "Ürünlerimiz": "Our Products",
        "Hakkımızda": "About Us",
        "Interpoint Kompresör": "Interpoint Compressor",
        "Güvenilir Hizmet.": "Reliable Service.",
        "Mükemmel Çözümler.": "Perfect Solutions.",
        "Servis & Yedek Parça": "Service & Spare Parts",
        "INTERPOINT": "INTERPOINT",
        "KOMPRESOR": "COMPRESSOR"
    };

    function isLocalStorageAvailable() {
        try {
            localStorage.setItem("test", "test");
            localStorage.removeItem("test");
            return true;
        } catch (e) {
            return false;
        }
    }

    function getLang() {
        if (isLocalStorageAvailable()) {
            return localStorage.getItem("selectedLang") || "tr";
        } else {
            return document.cookie.replace(/(?:(?:^|.*;\s*)selectedLang\s*=\s*([^;]*).*$)|^.*$/, "$1") || "tr";
        }
    }

    function setLang(lang) {
        if (isLocalStorageAvailable()) {
            localStorage.setItem("selectedLang", lang);
        } else {
            document.cookie = `selectedLang=${lang}; path=/; max-age=31536000`; // 1 yıl sakla
        }
    }

    let currentLang = getLang();
    updateLanguage(currentLang);

    langToggle.addEventListener("click", function () {
        loadingScreen.classList.add("show");

        setTimeout(() => {
            currentLang = currentLang === "tr" ? "en" : "tr";
            setLang(currentLang);
            updateLanguage(currentLang);

            if (navbarCollapse.classList.contains("show")) {
                navbarCollapse.classList.remove("show");
            }

            setTimeout(() => {
                loadingScreen.classList.remove("show");
            }, 300);
        }, 300);
    });

    function updateLanguage(lang) {
        langToggle.textContent = lang === "tr" ? "EN" : "TR";

        document.querySelectorAll(".nav-link, .navbar-brand span, .altBaslik, .sirketAd").forEach(el => {
            let text = el.textContent.trim();
            if (lang === "en" && elementsToTranslate[text]) {
                el.textContent = elementsToTranslate[text];
            } else if (lang === "tr") {
                let trText = Object.keys(elementsToTranslate).find(key => elementsToTranslate[key] === text);
                if (trText) el.textContent = trText;
            }
        });
    }
});

  </script>
  
<script>
    const images = document.querySelectorAll(".image-wrapper img");
    const dotsContainer = document.getElementById("dots");
    let currentIndex = 0;
    let interval;
    
    function createDots() {
        for (let i = 0; i < images.length; i++) {
            const dot = document.createElement("div");
            dot.classList.add("dot");
            dot.dataset.index = i;
            dot.addEventListener("click", function() {
                clearInterval(interval);
                moveToSlide(i);
                autoSlide();
            });
            dotsContainer.appendChild(dot);
        }
        updateDots();
    }
    
    function updateDots() {
        document.querySelectorAll(".dot").forEach(dot => dot.classList.remove("active"));
        dotsContainer.children[currentIndex].classList.add("active");
    }
    
    function moveToSlide(index) {
    images.forEach(img => {
        img.classList.remove("active");
        img.style.transform = "translateY(-100%)"; // Eski resim yukarı kayar
    });

    images[index].classList.add("active");
    images[index].style.top = "0"; // Yeni resmin görünmesi için top sıfırlanır
    images[index].style.transform = "translateY(0)"; // Yeni resim aşağı kayarak gelir
    currentIndex = index;
    updateDots();
}


    function autoSlide() {
        interval = setInterval(() => {
            currentIndex = (currentIndex + 1) % images.length;
            moveToSlide(currentIndex);
        }, 3000);
    }
    
    createDots();
    autoSlide();
</script>
