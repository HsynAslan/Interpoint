<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpoint Kompresör</title>
    <link rel="icon" type="image/png" href="./images/Interpoint Compressor Logo.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Özel CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
    </div>
    
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand active" href="/index.html">
            <img src="./images/Interpoint Compressor Logo.png" alt="Interpoint Logo" class="navbar-logo">
            <span style="color: white;" class="active">Interpoint</span>
        </a>
        <!-- Hamburger Menü Butonu (Sadece 768px ve altı) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
            data-bs-target="#navbarNav" aria-controls="navbarNav" 
            aria-expanded="false" aria-label="Toggle navigation" >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Menü Öğeleri -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto" style="display: flex; flex-direction: row-reverse;">
                <li class="nav-item" style="margin-left: 4vh;">
                    <a class="nav-link" href="/iletisim.html">İletişim</a>
                </li>
                <li class="nav-item" style="margin-left: 4vh;">
                    <a class="nav-link" href="/ürünlerimiz.html">Ürünlerimiz</a>
                </li>
                <li class="nav-item" style="margin-left: 4vh;">
                    <a class="nav-link" aria-current="page" href="/hakkimizda.html">Hakkımızda</a>
                </li>
            </ul>
        </div>
    </div>
</nav>



    <!-- Ana İçerik -->
    <div class="container-fluid main-content">
        <div class="row h-100">
            <!-- Sol Taraf -->
            <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center">
                <div class="mb-3" style="display: flex;">
                    <i class="bi bi-shield-check icon-large icon"></i>
                    <div style="display: flex; flex-direction: column;
                    flex-wrap: wrap;
                    align-items: flex-start;">
                    <span class="altBaslik">Güvenilir Hizmet.</span>
                    <span class="altBaslik"><p>Mükemmel Çözümler.</p></span> 
                </div>
                </div>
                <h1 class="sirketAd">INTERPOINT</h1>
                <h1 class="sirketAd">KOMPRESOR</h1>
                <p class="lead altBaslik" >Servis & Yedek Parça</p>
                
            </div>
            <!-- Sağ Taraf -->
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="row" style="margin-top: 4vh;">
                    <div class="col-6">
                        <img src="./images/anasayfa1.png" class="img-fluid mb-3" alt="Resim 1">
                        <img src="./images/anasayfa3.png" class="img-fluid" alt="Resim 2">
                    </div>
                    <div class="col-6 d-flex align-items-center">
                        <img src="./images/anasayfa2.png" class="img-fluid" alt="Resim 3">
                    </div>
                </div>
            </div>
        </div>
    </div>
   
    <!-- Bootstrap 5 JS ve Bağımlılıkları -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loadingScreen = document.getElementById("loading-screen");
        
            // Sayfa ilk açıldığında loading spinner'ı gizle
            setTimeout(() => {
                loadingScreen.classList.remove("show");
            }, 500);
        
            // Tüm linkleri dinle
            document.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", function (event) {
                    const href = this.getAttribute("href");
        
                    // Eğer href değeri boşsa veya sayfa içi bağlantıysa, işlemi durdur
                    if (!href || href.startsWith("#") || href.startsWith("javascript")) return;
        
                    // Telefon ve e-posta bağlantılarında yükleme ekranını tetikleme
                    if (href.startsWith("tel:") || href.startsWith("mailto:")) return;
        
                    // Normal linkler için loading-screen göster ve yönlendir
                    event.preventDefault();
                    loadingScreen.classList.add("show");
        
                    setTimeout(() => {
                        window.location.assign(href);
                    }, 800);
                });
            });
        
            // 🔹 GERİ TUŞU İLE GELİNİRSE LOADING SPINNER'I GİZLE
            window.addEventListener("pageshow", function (event) {
                if (event.persisted) { 
                    loadingScreen.classList.remove("show");
                }
            });
        });
        </script>
        
        
        
        
</body>
</html>
