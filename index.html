<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpoint Kompresör</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Özel CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Interpoint</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- ms-auto ile menü öğelerini sağa yasla -->
                <ul class="navbar-nav ms-auto" style="display: flex; flex-direction: row-reverse;">
                    <li class="nav-item" style="margin-left: 4vh;">
                        <a class="nav-link active" aria-current="page" href="#">Hakkımızda</a>
                    </li>
                    <li class="nav-item" style="margin-left: 4vh;">
                        <a class="nav-link" href="#">Ürünlerimiz</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">İletişim</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Ana İçerik -->
    <div class="container-fluid main-content">
        <div class="row h-100">
            <!-- Sol Taraf -->
            <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center">
                <div class="mb-3">
                    <i class="bi bi-shield-check icon-large"></i>
                    <span>Güvenilir Hizmet</span>
                </div>
                <h1 class="display-4">INTERPOINT</h1>
                <h1 class="display-4">KOMPRESOR</h1>
                <p class="lead">Servis & Yedek Parça</p>
                <p>Mükemmel Çözümler</p>
            </div>
            <!-- Sağ Taraf -->
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="row" style="margin-top: 4vh;">
                    <div class="col-6">
                        <img src="https://picsum.photos/300" class="img-fluid mb-3" alt="Resim 1">
                        <img src="https://picsum.photos/300" class="img-fluid" alt="Resim 2">
                    </div>
                    <div class="col-6 d-flex align-items-center">
                        <img src="https://picsum.photos/300" class="img-fluid" alt="Resim 3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS ve Bağımlılıkları -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
